CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_PWM=y
CONFIG_PWM_STM32=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_THREAD_MONITOR=y

# CubeMot modules
CONFIG_NEWLIB_LIBC=n
CONFIG_PICOLIBC=y
CONFIG_FPU=y

# Module enable flags
CONFIG_MODULE_LED_CONTROLLER_ENABLE=n
CONFIG_MODULE_BUTTON_DETECTOR_ENABLE=n
CONFIG_MODULE_BLINK_ENABLE=n
CONFIG_MODULE_MOTOR_CTRL_ENABLE=y
CONFIG_MODULE_COMMANDER_ENABLE=y
CONFIG_MODULE_VEHICLE_ENABLE=y
CONFIG_MODULE_SERIAL_CMD_ENABLE=y
CONFIG_MODULE_SERVO_CTRL=n

# Thread stack sizes
CONFIG_MAIN_STACK_SIZE=1024

# ADC for FOC
CONFIG_ADC=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=256

# UART interrupt-driven API (for serial_cmd RX)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# STM32 HAL LL drivers (used directly by FOC code)
CONFIG_CLOCK_CONTROL=y
CONFIG_PINCTRL=y
