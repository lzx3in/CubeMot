name: Code Format Check

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  c-cpp:
    name: C/C++ Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: "."
          extensions: "c,h,cpp,hpp,cc,hh,cxx,hxx"
          clangFormatVersion: 19
          style: file

  python:
    name: Python Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          src: >-
            ./tools/
          args: "format --check --diff"

  shell:
    name: Shell Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt

      # Google Shell Style Guide: https://google.github.io/styleguide/shellguide.html
      # -i 2: 2-space indent, -ci: indent switch cases, -bn: binary ops start line
      # -sr: space after redirects (improves readability; not required but compatible)
      - name: Check shell script formatting
        run: shfmt -f ./tools/ | xargs shfmt -d -i 2 -ci -bn -sr
