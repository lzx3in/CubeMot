CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_SHELL=n

# CubeMot modules
CONFIG_NEWLIB_LIBC=n
CONFIG_PICOLIBC=y
CONFIG_FPU=y

# Module enable flags
CONFIG_MODULE_LED_CONTROLLER_ENABLE=y
CONFIG_MODULE_BUTTON_DETECTOR_ENABLE=y
CONFIG_MODULE_BLINK_ENABLE=y
CONFIG_MODULE_MOTOR_CTRL_ENABLE=y
CONFIG_MODULE_COMMANDER_ENABLE=y
CONFIG_MODULE_VEHICLE_ENABLE=y
CONFIG_MODULE_SERIAL_CMD_ENABLE=y
CONFIG_MODULE_SERVO_CTRL=y

# Thread stack sizes
CONFIG_MAIN_STACK_SIZE=1024

# ADC for FOC
CONFIG_ADC=y
CONFIG_LOG=y

# UART interrupt-driven API (for serial_cmd RX)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# STM32 HAL LL drivers (used directly by FOC code)
CONFIG_CLOCK_CONTROL=y
CONFIG_PINCTRL=y
