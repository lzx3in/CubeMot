description: PWM-driven servo motor (50Hz, 500-2500us pulse width)

compatible: "pwm-servo"

include: base.yaml

properties:
  pwms:
    required: true
    type: phandle-array
    description: |
      PWM channels for servo control.
      Period should be 20ms (50Hz). Pulse width 500-2500us maps to -90/+90 deg.

  pwm-names:
    required: true
    type: string-array
    description: Names for each PWM channel.
